name: PR Secret Leakage Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan PR via GripoFlow and enforce result
        env:
          GRIPOFLOW_WEBHOOK_URL: ${{ secrets.GRIPOFLOW_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "repository": {
              "clone_url": "${{ github.event.repository.clone_url }}",
              "full_name": "${{ github.repository }}"
            },
            "pull_request": {
              "number": ${{ github.event.pull_request.number }},
              "head_sha": "${{ github.event.pull_request.head.sha }}",
              "head_ref": "${{ github.event.pull_request.head.ref }}",
              "base_ref": "${{ github.event.pull_request.base.ref }}"
            }
          }
          EOF
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$GRIPOFLOW_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "GripoFlow response ($HTTP_CODE):"
          echo "$BODY"

          STATUS=$(echo "$BODY" | grep -o '"status"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | sed 's/.*:[[:space:]]*"//; s/"$//')

          if [ "$STATUS" = "failure" ]; then
            echo "::error::Gitleaks detected secrets in this PR. Merge blocked."
            exit 1
          elif [ "$STATUS" != "success" ]; then
            echo "::error::Unexpected or missing response from GripoFlow — treating as failure."
            exit 1
          fi

          echo "No secrets detected. PR clear to merge."
