name: PR Secret Leakage Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  gitleaks-scan:
    name: GripoFlow Gitleaks Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Scan PR via GripoFlow
        env:
          GRIPOFLOW_WEBHOOK_URL: ${{ secrets.GRIPOFLOW_WEBHOOK_URL }}
          GRIPOFLOW_API_URL: ${{ secrets.GRIPOFLOW_API_URL }}
          GRIPOFLOW_API_TOKEN: ${{ secrets.GRIPOFLOW_API_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GripoFlow Gitleaks Security Gate"
          echo "========================================"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          REPO_URL="${{ github.event.repository.clone_url }}"
          REPO_NAME="${{ github.repository }}"

          echo "PR: $PR_NUMBER"
          echo "HEAD SHA: $HEAD_SHA"
          echo "HEAD REF: $HEAD_REF"
          echo "BASE REF: $BASE_REF"
          echo "Repository: $REPO_NAME"

          # ================================================
          # 1. Prepare webhook payload
          # ================================================

          PAYLOAD=$(cat <<EOF
          {
            "repository": {
              "clone_url": "$REPO_URL",
              "full_name": "$REPO_NAME"
            },
            "pull_request": {
              "number": $PR_NUMBER,
              "head_sha": "$HEAD_SHA",
              "head_ref": "$HEAD_REF",
              "base_ref": "$BASE_REF"
            }
          }
          EOF
          )

          # ================================================
          # 2. Trigger GripoFlow
          # ================================================

          echo ""
          echo "Triggering GripoFlow..."

          RESPONSE=$(curl -sS \
            -X POST \
            "$GRIPOFLOW_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Webhook response:"
          echo "$RESPONSE"

          echo ""
          echo "Webhook accepted."
          echo "Waiting for GripoFlow execution..."

          sleep 3

          # ================================================
          # 3. Find GripoFlow execution
          # ================================================

          EXECUTION_ID=""

          for ATTEMPT in $(seq 1 30); do

            echo ""
            echo "Checking GripoFlow executions... attempt $ATTEMPT/30"

            EXECUTIONS=$(curl -sS \
              -H "Authorization: Bearer $GRIPOFLOW_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$GRIPOFLOW_API_URL")

            # Find execution belonging to this PR/HEAD SHA.
            EXECUTION_ID=$(echo "$EXECUTIONS" | jq -r \
              --arg sha "$HEAD_SHA" \
              --arg pr "$PR_NUMBER" \
              '
              .executions[]
              | select(
                  (.input.pull_request.head_sha == $sha)
                  or
                  (.input.pull_request.number == ($pr | tonumber))
                )
              | .id
              ' 2>/dev/null | head -n1)

            if [ -n "$EXECUTION_ID" ] && [ "$EXECUTION_ID" != "null" ]; then
              echo ""
              echo "Found GripoFlow execution:"
              echo "$EXECUTION_ID"
              break
            fi

            sleep 2
          done

          if [ -z "$EXECUTION_ID" ]; then
            echo ""
            echo "::error::Could not find GripoFlow execution."
            exit 1
          fi

          # ================================================
          # 4. Monitor execution
          # ================================================

          echo ""
          echo "Monitoring execution: $EXECUTION_ID"

          RESULT=""

          for ATTEMPT in $(seq 1 60); do

            echo ""
            echo "Polling GripoFlow... attempt $ATTEMPT/60"

            EXECUTION=$(curl -sS \
              -H "Authorization: Bearer $GRIPOFLOW_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$GRIPOFLOW_API_URL/$EXECUTION_ID")

            WORKFLOW_STATUS=$(echo "$EXECUTION" | \
              jq -r '.status // empty')

            echo "Workflow status: $WORKFLOW_STATUS"

            if [ "$WORKFLOW_STATUS" = "completed" ]; then

              echo ""
              echo "GripoFlow workflow completed."

              RESULT=$(echo "$EXECUTION" | \
                jq -c '.activities.A1.output // empty')

              break
            fi

            if [ "$WORKFLOW_STATUS" = "failed" ]; then
              echo ""
              echo "::error::GripoFlow workflow itself failed."
              exit 1
            fi

            sleep 5
          done

          # ================================================
          # 5. Validate scan result
          # ================================================

          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo ""
            echo "::error::GripoFlow completed but no A1 scan result was returned."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "GripoFlow Gitleaks Result"
          echo "========================================"

          echo "$RESULT" | jq .

          # ================================================
          # 6. Read security result
          # ================================================

          SCAN_STATUS=$(echo "$RESULT" | jq -r '.status // empty')

          echo ""
          echo "========================================"
          echo "Security scan status: $SCAN_STATUS"
          echo "========================================"

          # ================================================
          # 7. Enforce GitHub security gate
          # ================================================

          if [ "$SCAN_STATUS" = "failure" ]; then

            FINDINGS=$(echo "$RESULT" | jq -r '.findings // 0')
            SUMMARY=$(echo "$RESULT" | jq -r '.summary // "Secrets detected"')

            echo ""
            echo "========================================"
            echo "SECURITY SCAN FAILED"
            echo "========================================"

            echo "Findings: $FINDINGS"
            echo "Summary: $SUMMARY"
            echo ""
            echo "Secrets were detected by Gitleaks."
            echo "This pull request must not be merged."

            echo "::error::Gitleaks detected secrets in this PR."

            exit 1
          fi

          if [ "$SCAN_STATUS" = "success" ]; then

            echo ""
            echo "========================================"
            echo "SECURITY SCAN PASSED"
            echo "========================================"

            echo "No secrets were detected."
            echo "Pull request may proceed."

            exit 0
          fi

          # ================================================
          # 8. Unknown result = fail closed
          # ================================================

          echo ""
          echo "::error::Unexpected or missing security scan status."
          echo "Received: $SCAN_STATUS"

          exit 1
