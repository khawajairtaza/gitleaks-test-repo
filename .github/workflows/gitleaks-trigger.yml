name: PR Secret Leakage Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Scan PR via GripoFlow and enforce result
        env:
          GRIPOFLOW_WEBHOOK_URL: ${{ secrets.GRIPOFLOW_WEBHOOK_URL }}
          GRIPOFLOW_API_URL: ${{ secrets.GRIPOFLOW_API_URL }}
          GRIPOFLOW_API_TOKEN: ${{ secrets.GRIPOFLOW_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -e

          echo "========================================"
          echo "Starting GripoFlow Gitleaks PR Gate"
          echo "========================================"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          REPO_URL="${{ github.event.repository.clone_url }}"
          REPO_FULL_NAME="${{ github.repository }}"

          echo "PR: $PR_NUMBER"
          echo "HEAD SHA: $HEAD_SHA"
          echo "HEAD REF: $HEAD_REF"
          echo "BASE REF: $BASE_REF"
          echo "Repository: $REPO_FULL_NAME"

          # ==================================================
          # 1. Build PR payload
          # ==================================================

          PAYLOAD=$(cat <<EOF
          {
            "repository": {
              "clone_url": "$REPO_URL",
              "full_name": "$REPO_FULL_NAME"
            },
            "pull_request": {
              "number": $PR_NUMBER,
              "head_sha": "$HEAD_SHA",
              "head_ref": "$HEAD_REF",
              "base_ref": "$BASE_REF"
            }
          }
          EOF
          )

          echo ""
          echo "PR payload created."

          # ==================================================
          # 2. Validate GripoFlow webhook configuration
          # ==================================================

          echo ""
          echo "Checking GripoFlow webhook configuration..."

          if [ -z "$GRIPOFLOW_WEBHOOK_URL" ]; then
            echo "::error::GRIPOFLOW_WEBHOOK_URL is empty or not configured."
            exit 1
          fi

          echo "Webhook URL is configured."

          # ==================================================
          # 3. Send PR data to GripoFlow
          # ==================================================

          echo ""
          echo "Sending PR data to GripoFlow..."

          set +e

          RESPONSE=$(curl -sS \
            --connect-timeout 15 \
            --max-time 60 \
            -w "\n%{http_code}" \
            -X POST "$GRIPOFLOW_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            -d "$PAYLOAD")

          CURL_EXIT=$?

          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::curl failed while contacting GripoFlow."
            echo "curl exit code: $CURL_EXIT"
            exit 1
          fi

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "GripoFlow HTTP status: $HTTP_CODE"
          echo "GripoFlow response:"
          echo "$BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::GripoFlow webhook returned HTTP $HTTP_CODE."
            exit 1
          fi

          echo ""
          echo "GripoFlow accepted the webhook request."

          # ==================================================
          # 4. Validate API configuration
          # ==================================================

          echo ""
          echo "Checking GripoFlow API configuration..."

          if [ -z "$GRIPOFLOW_API_URL" ]; then
            echo "::error::GRIPOFLOW_API_URL is empty or not configured."
            exit 1
          fi

          if [ -z "$GRIPOFLOW_API_TOKEN" ]; then
            echo "::error::GRIPOFLOW_API_TOKEN is empty or not configured."
            exit 1
          fi

          echo "GripoFlow API configuration is present."

          # ==================================================
          # 5. Wait for GripoFlow execution
          # ==================================================

          echo ""
          echo "Waiting for GripoFlow execution..."

          EXECUTION_ID=""

          for ATTEMPT in $(seq 1 30); do

            echo "Checking GripoFlow executions... attempt $ATTEMPT/30"

            EXECUTIONS=$(curl -sS \
              --connect-timeout 15 \
              --max-time 30 \
              -H "Authorization: Bearer $GRIPOFLOW_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$GRIPOFLOW_API_URL")

            EXECUTION_ID=$(echo "$EXECUTIONS" | jq -r \
              --arg sha "$HEAD_SHA" '
              if .executions then
                [
                  .executions[]
                  | select(
                      (.input.pull_request.head_sha? == $sha)
                      or
                      (.input.head_sha? == $sha)
                      or
                      (.head_sha? == $sha)
                  )
                ][0].id // empty
              else
                empty
              end
              ')

            if [ -n "$EXECUTION_ID" ] && [ "$EXECUTION_ID" != "null" ]; then
              echo ""
              echo "Found GripoFlow execution:"
              echo "$EXECUTION_ID"
              break
            fi

            sleep 2

          done

          if [ -z "$EXECUTION_ID" ]; then
            echo "::error::Could not find the GripoFlow execution."
            exit 1
          fi

          # ==================================================
          # 6. Poll execution until completed
          # ==================================================

          echo ""
          echo "Monitoring execution: $EXECUTION_ID"

          FINAL_EXECUTION=""

          for ATTEMPT in $(seq 1 60); do

            echo ""
            echo "Polling GripoFlow... attempt $ATTEMPT/60"

            EXECUTION=$(curl -sS \
              --connect-timeout 15 \
              --max-time 30 \
              -H "Authorization: Bearer $GRIPOFLOW_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$GRIPOFLOW_API_URL/$EXECUTION_ID")

            WORKFLOW_STATUS=$(echo "$EXECUTION" | jq -r '.status // empty')

            echo "Workflow status: $WORKFLOW_STATUS"

            if [ "$WORKFLOW_STATUS" = "completed" ]; then
              FINAL_EXECUTION="$EXECUTION"
              echo ""
              echo "GripoFlow execution completed."
              break
            fi

            if [ "$WORKFLOW_STATUS" = "failed" ]; then
              echo "::error::GripoFlow workflow execution failed."
              echo "$EXECUTION"
              exit 1
            fi

            sleep 5

          done

          if [ -z "$FINAL_EXECUTION" ]; then
            echo "::error::GripoFlow execution timed out."
            exit 1
          fi

          # ==================================================
          # 7. Read A1 result
          # ==================================================

          echo ""
          echo "========================================"
          echo "GripoFlow Gitleaks Result"
          echo "========================================"

          A1_RESULT=$(echo "$FINAL_EXECUTION" | jq -c '.activities.A1.output // empty')

          if [ -z "$A1_RESULT" ] || [ "$A1_RESULT" = "null" ]; then
            echo "::error::A1 result was not found in GripoFlow execution."
            exit 1
          fi

          echo "A1 Result:"
          echo "$A1_RESULT" | jq .

          # ==================================================
          # 8. Extract security result
          # ==================================================

          STATUS=$(echo "$A1_RESULT" | jq -r '.status // empty')
          FINDINGS=$(echo "$A1_RESULT" | jq -r '.findings // 0')
          SUMMARY=$(echo "$A1_RESULT" | jq -r '.summary // empty')

          echo ""
          echo "Security scan status: $STATUS"
          echo "Findings: $FINDINGS"
          echo "Summary: $SUMMARY"

          # ==================================================
          # 9. Enforce GitHub PR security gate
          # ==================================================

          if [ "$STATUS" = "failure" ]; then

            echo ""
            echo "========================================"
            echo "SECURITY SCAN FAILED"
            echo "========================================"

            echo "::error::Gitleaks detected $FINDINGS secret(s)."
            echo "::error::This pull request must not be merged."

            echo "========================================"

            exit 1

          elif [ "$STATUS" = "success" ]; then

            echo ""
            echo "========================================"
            echo "SECURITY SCAN PASSED"
            echo "========================================"

            echo "No secrets detected."
            echo "PR is clear to merge."

            echo "========================================"

            exit 0

          else

            echo ""
            echo "::error::Unexpected A1 security status: $STATUS"
            echo "Failing closed for security."

            exit 1

          fi
