name: PR Secret Leakage Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger GripoFlow Gitleaks Scan
        env:
          GRIPOFLOW_WEBHOOK_URL: ${{ secrets.GRIPOFLOW_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -e

          echo "========================================"
          echo "Starting GripoFlow Gitleaks PR Gate"
          echo "========================================"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          REPO_FULL_NAME="${{ github.repository }}"

          echo "PR: $PR_NUMBER"
          echo "HEAD SHA: $HEAD_SHA"
          echo "Repository: $REPO_FULL_NAME"

          if [ -z "$GRIPOFLOW_WEBHOOK_URL" ]; then
            echo "::error::GRIPOFLOW_WEBHOOK_URL is not configured."
            exit 1
          fi

          # ==================================================
          # 1. Build payload
          # ==================================================

          PAYLOAD=$(jq -n \
            --arg clone_url "${{ github.event.repository.clone_url }}" \
            --arg full_name "$REPO_FULL_NAME" \
            --arg sha "$HEAD_SHA" \
            --arg head_ref "${{ github.event.pull_request.head.ref }}" \
            --arg base_ref "${{ github.event.pull_request.base.ref }}" \
            --argjson number "$PR_NUMBER" \
            '{
              repository: {
                clone_url: $clone_url,
                full_name: $full_name
              },
              pull_request: {
                number: $number,
                head_sha: $sha,
                head_ref: $head_ref,
                base_ref: $base_ref
              }
            }')

          # ==================================================
          # 2. Trigger GripoFlow
          # ==================================================

          echo ""
          echo "Sending PR data to GripoFlow..."

          RESPONSE=$(curl -sS \
            --connect-timeout 15 \
            --max-time 60 \
            -w "\n%{http_code}" \
            -X POST "$GRIPOFLOW_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "GripoFlow HTTP status: $HTTP_CODE"
          echo "GripoFlow response:"
          echo "$BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::GripoFlow webhook returned HTTP $HTTP_CODE."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "GripoFlow workflow triggered."
          echo "Waiting for GripoFlow security result..."
          echo "========================================"

          # ==================================================
          # 3. Wait for GripoFlow to update GitHub status
          # ==================================================

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=5

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do

            echo ""
            echo "Checking GitHub status..."
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS"

            STATUS_JSON=$(gh api \
              "/repos/$REPO_FULL_NAME/commits/$HEAD_SHA/status" \
              --jq '.statuses')

            GRIPO_STATUS=$(echo "$STATUS_JSON" | jq -r '
              map(select(.context == "GripoFlow / Gitleaks"))
              | sort_by(.created_at)
              | last
              | .state // empty
            ')

            DESCRIPTION=$(echo "$STATUS_JSON" | jq -r '
              map(select(.context == "GripoFlow / Gitleaks"))
              | sort_by(.created_at)
              | last
              | .description // empty
            ')

            echo "GripoFlow status: ${GRIPO_STATUS:-pending}"
            echo "Description: ${DESCRIPTION:-Waiting for GripoFlow}"

            # ==================================================
            # SUCCESS
            # ==================================================

            if [ "$GRIPO_STATUS" = "success" ]; then

              echo ""
              echo "========================================"
              echo "SECURITY SCAN PASSED"
              echo "========================================"

              echo "GripoFlow Gitleaks scan passed."
              echo "No secrets detected."

              exit 0
            fi

            # ==================================================
            # FAILURE
            # ==================================================

            if [ "$GRIPO_STATUS" = "failure" ]; then

              echo ""
              echo "========================================"
              echo "SECURITY SCAN FAILED"
              echo "========================================"

              echo "::error::GripoFlow detected secrets in this PR."
              echo "::error::$DESCRIPTION"

              exit 1
            fi

            # ==================================================
            # ERROR
            # ==================================================

            if [ "$GRIPO_STATUS" = "error" ]; then

              echo ""
              echo "::error::GripoFlow returned an error status."
              exit 1
            fi

            sleep "$SLEEP_SECONDS"

          done

          # ==================================================
          # 4. Timeout
          # ==================================================

          echo ""
          echo "========================================"
          echo "GRIPOFLOW TIMEOUT"
          echo "========================================"

          echo "::error::GripoFlow did not report a final security result within the timeout period."

          exit 1
