name: PR Secret Leakage Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger GripoFlow Gitleaks Scan
        env:
          GRIPOFLOW_WEBHOOK_URL: ${{ secrets.GRIPOFLOW_WEBHOOK_URL }}

        run: |
          set -e

          echo "========================================"
          echo "Starting GripoFlow Gitleaks PR Gate"
          echo "========================================"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          REPO_URL="${{ github.event.repository.clone_url }}"
          REPO_FULL_NAME="${{ github.repository }}"

          echo "PR: $PR_NUMBER"
          echo "HEAD SHA: $HEAD_SHA"
          echo "HEAD REF: $HEAD_REF"
          echo "BASE REF: $BASE_REF"
          echo "Repository: $REPO_FULL_NAME"

          if [ -z "$GRIPOFLOW_WEBHOOK_URL" ]; then
            echo "::error::GRIPOFLOW_WEBHOOK_URL is not configured."
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg clone_url "$REPO_URL" \
            --arg full_name "$REPO_FULL_NAME" \
            --arg sha "$HEAD_SHA" \
            --arg head_ref "$HEAD_REF" \
            --arg base_ref "$BASE_REF" \
            --argjson number "$PR_NUMBER" \
            '{
              repository: {
                clone_url: $clone_url,
                full_name: $full_name
              },
              pull_request: {
                number: $number,
                head_sha: $sha,
                head_ref: $head_ref,
                base_ref: $base_ref
              }
            }')

          echo ""
          echo "Sending PR data to GripoFlow..."

          RESPONSE=$(curl -sS \
            --connect-timeout 15 \
            --max-time 60 \
            -w "\n%{http_code}" \
            -X POST "$GRIPOFLOW_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            -d "$PAYLOAD")

          CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Failed to contact GripoFlow."
            exit 1
          fi

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "GripoFlow HTTP status: $HTTP_CODE"
          echo "GripoFlow response:"
          echo "$BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::GripoFlow webhook returned HTTP $HTTP_CODE."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "GripoFlow workflow triggered successfully."
          echo "========================================"
          echo ""
          echo "GripoFlow will perform the Gitleaks scan"
          echo "and report the result back to GitHub."

          exit 0
