name: PR Secret Leakage Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check GripoFlow configuration
        env:
          GRIPOFLOW_WEBHOOK_URL: ${{ secrets.GRIPOFLOW_WEBHOOK_URL }}
        run: |
          if [ -z "$GRIPOFLOW_WEBHOOK_URL" ]; then
            echo "::error::GRIPOFLOW_WEBHOOK_URL is empty or unavailable"
            exit 1
          fi

          echo "GRIPOFLOW_WEBHOOK_URL is available"
          echo "URL length: ${#GRIPOFLOW_WEBHOOK_URL}"

      - name: Scan PR via GripoFlow
        env:
          GRIPOFLOW_WEBHOOK_URL: ${{ secrets.GRIPOFLOW_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "repository": {
              "clone_url": "${{ github.event.repository.clone_url }}",
              "full_name": "${{ github.repository }}"
            },
            "pull_request": {
              "number": ${{ github.event.pull_request.number }},
              "head_sha": "${{ github.event.pull_request.head.sha }}",
              "head_ref": "${{ github.event.pull_request.head.ref }}",
              "base_ref": "${{ github.event.pull_request.base.ref }}"
            }
          }
          EOF
          )

          echo "Triggering GripoFlow..."

          HTTP_CODE=$(curl -sS -o /tmp/gripoflow-response.txt \
            -w "%{http_code}" \
            -X POST "$GRIPOFLOW_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP status: $HTTP_CODE"
          echo "GripoFlow response:"
          cat /tmp/gripoflow-response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to trigger GripoFlow"
            exit 1
          fi

          echo "GripoFlow workflow triggered successfully."
